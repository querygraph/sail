[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gfrs-poc"
version = "0.1.0"
description = "PySpark port of the graphframes-rs Pregel engine and delta PageRank (proof of concept)"
requires-python = ">=3.10"
dependencies = ["pyspark[connect]>=4.0,<4.2"]

[tool.setuptools.packages.find]
where = ["src"]
