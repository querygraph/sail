[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-pecan"
version = "0.1.0"
description = "Pecan: client-controlled relational graph algorithms over Spark Connect"
requires-python = ">=3.10"
dependencies = ["pyspark[connect]==4.0.1", "protobuf>=7.36.1,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a Spark Connect endpoint with the graph utils service"]
