[package]
name = "sail-second-string-extension"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-schema = "=59.3.0"
datafusion-common = { version = "=55.1.0", default-features = false }
datafusion-expr = { version = "=55.1.0", default-features = false }
datafusion-ffi = "=55.1.0"
pyo3 = "=0.29.0"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
