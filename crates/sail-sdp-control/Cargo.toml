[package]
name = "sail-sdp-control"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure control model for durable declarative-pipeline runs: identities, fence tokens, guarded transitions and receipts (CDC-CONTROL-STORE-DESIGN.md)"

[lints]
workspace = true

[features]
# The Turso authority adapter (see src/turso_store.rs for its qualification).
turso = ["dep:turso"]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
tokio = { workspace = true }
turso = { version = "0.7.2", default-features = false, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
